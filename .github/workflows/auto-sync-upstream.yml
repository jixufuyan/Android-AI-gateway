name: Auto Sync Upstream & Build

# 自动跟上游：
#   1. 定时（每 6 小时）检查上游有没有新提交
#   2. 有就自动合并（工具链冲突保留本地版，其它冲突则放弃并通知）
#   3. 核对二改补丁没被上游悄悄覆盖
#   4. 推回 ide 分支
#   5. 版本号按「上游 patch + 1」计算，versionCode 按「上游 code × 10 + 1」
#   6. 构建 APK 并发 Release
#
# 手动触发时可以选「只检查不合并」，方便先看看会发生什么。

on:
  schedule:
    # 每 6 小时一次（UTC）。GitHub 的 cron 在高峰期可能延迟几分钟到半小时。
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查不合并（不推送、不构建）'
        required: false
        default: false
        type: boolean
      force_build:
        description: '即使没同步也构建一次'
        required: false
        default: false
        type: boolean

# 两个工作流同时改 ide 分支会打架，串行执行
concurrency:
  group: auto-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  # ============================================================
  # 第一步：同步上游
  # ============================================================
  sync:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.sync.outputs.SYNC_RESULT }}
      sha: ${{ steps.sync.outputs.SYNC_SHA }}
      count: ${{ steps.sync.outputs.SYNC_COUNT }}
      conflicts: ${{ steps.sync.outputs.SYNC_CONFLICTS }}
      exit_code: ${{ steps.sync.outputs.exit_code }}
      upstream_log: ${{ steps.sync.outputs.SYNC_UPSTREAM_LOG }}
      upstream_ref: ${{ steps.sync.outputs.SYNC_UPSTREAM_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ide
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远端
        run: |
          git remote add upstream https://github.com/xibai6668/Android-AI-gateway.git 2>/dev/null \
            || git remote set-url upstream https://github.com/xibai6668/Android-AI-gateway.git
          git remote -v

      - name: 同步上游
        id: sync
        env:
          UPSTREAM_REMOTE: upstream
          UPSTREAM_BRANCH: main
        run: |
          chmod +x tools/ci-sync-upstream.sh
          set +e
          bash tools/ci-sync-upstream.sh
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # 0=最新 10=合并成功 78=冲突放弃 其它=错误
          case "$CODE" in
            0|10|78) exit 0 ;;
            *) echo "::error::同步脚本异常退出（$CODE）"; exit 1 ;;
          esac

      - name: 同步结果汇总
        if: always()
        run: |
          {
            echo "### 上游同步结果"
            echo ""
            echo "- 结果：\`${{ steps.sync.outputs.SYNC_RESULT }}\`"
            echo "- 退出码：\`${{ steps.sync.outputs.exit_code }}\`"
            echo "- 新提交：\`${{ steps.sync.outputs.SYNC_SHA }}\`"
            echo "- 合并数：${{ steps.sync.outputs.SYNC_COUNT }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 有冲突 → 建 Issue 提醒
        if: |
          steps.sync.outputs.SYNC_RESULT == 'conflict' ||
          steps.sync.outputs.SYNC_RESULT == 'guard-lost'
        uses: actions/github-script@v8
        env:
          SYNC_RESULT: ${{ steps.sync.outputs.SYNC_RESULT }}
          SYNC_FILES: ${{ steps.sync.outputs.SYNC_CONFLICTS }}
        with:
          script: |
            const r = process.env.SYNC_RESULT;
            const files = process.env.SYNC_FILES || '';
            const title = r === 'guard-lost'
              ? '⚠️ 上游同步被拦：二改补丁丢失'
              : '⚠️ 上游同步被拦：有冲突需要手工处理';
            const body = [
              '## 自动同步上游失败',
              '',
              `**结果**：\`${r}\``,
              '',
              r === 'guard-lost'
                ? '上游改动把二改的补丁覆盖掉了（**编译不会报错，但功能会静默消失**）。'
                : '以下文件有冲突，无法按预设规则自动解决：',
              '',
              files ? '```\n' + files + '\n```' : '_（无文件列表）_',
              '',
              '### 手工处理办法',
              '',
              '```bash',
              'git fetch upstream',
              'git checkout ide',
              'git merge upstream/main',
              '# 解决冲突后：',
              'git commit',
              'git push',
              '```',
              '',
              '或者本地跑 `bash sync-upstream.sh`（交互式，会逐步问你）。',
              '',
              `> 由自动同步工作流创建 · [查看本次运行](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync',
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-sync'],
              });
            }

      - name: 推送合并结果
        if: |
          steps.sync.outputs.SYNC_RESULT == 'merged' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git push origin HEAD:ide
          echo "已推送到 ide 分支" >> "$GITHUB_STEP_SUMMARY"

      - name: 同步成功 → 关闭之前的告警 Issue
        if: |
          steps.sync.outputs.SYNC_RESULT == 'merged' ||
          steps.sync.outputs.SYNC_RESULT == 'up-to-date'
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync',
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: '✅ 本次同步成功，自动关闭。',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }

  # ============================================================
  # 第二步：构建并发布（仅当同步产生了新提交）
  # ============================================================
  build:
    needs: sync
    if: |
      needs.sync.outputs.result == 'merged' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_build == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha || 'ide' }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # 注意：二改锁定 9.0.0，不要跟上游的 9.9.1
          gradle-version: '9.0.0'

      # --------------------------------------------------------
      # 版本号：只比上游大一点点
      # --------------------------------------------------------
      - name: 计算并写入版本号
        id: version
        env:
          UPSTREAM_REPO: https://github.com/xibai6668/Android-AI-gateway.git
        run: |
          set -e

          # 取上游最新版本号
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream main || true

          python3 - <<'PY'
          import re, subprocess, os, sys

          def upstream_text(path):
              return subprocess.run(
                  ['git', 'show', 'upstream/main:' + path],
                  capture_output=True, text=True
              ).stdout

          txt = upstream_text('app/build.gradle.kts') or upstream_text('app/build.gradle')
          if not txt:
              print('::error::读不到上游 build.gradle.kts'); sys.exit(1)

          m_ver = re.search(r'versionName\s*=\s*["\']([^"\']+)["\']', txt)
          m_code = re.search(r'versionCode\s*=\s*(\d+)', txt)
          if not m_ver or not m_code:
              print('::error::上游没找到 versionName/versionCode'); sys.exit(1)

          up_ver = m_ver.group(1)
          up_code = int(m_code.group(1))
          print('上游版本:', up_ver, '(', up_code, ')')

          # versionName：patch +1（2.38.4 → 2.38.5）
          # versionCode：+1（234 → 235）
          # 注意：只有自己装机时才这么干。若已有用户装了更高 code，
          # 新包会 INSTALL_FAILED_VERSION_DOWNGRADE，必须卸载重装。
          parts = re.match(r'^(\d+)\.(\d+)\.(\d+)(.*)$', up_ver)
          if not parts:
              print('::error::上游版本号格式不认识:', up_ver); sys.exit(1)
          major, minor, patch, suffix = parts.groups()
          new_ver = '%s.%s.%d%s' % (major, minor, int(patch) + 1, suffix)
          new_code = up_code + 1

          print('本次版本:', new_ver, '(', new_code, ')')

          # 写回本地文件
          path = 'app/build.gradle.kts'
          if not os.path.exists(path):
              path = 'app/build.gradle'
          src = open(path, encoding='utf-8').read()

          src2 = re.sub(r'(versionName\s*=\s*)["\'][^"\']+["\']',
                        lambda m: m.group(1) + '"%s"' % new_ver, src, count=1)
          src2 = re.sub(r'(versionCode\s*=\s*)\d+',
                        lambda m: m.group(1) + str(new_code), src2, count=1)

          if src2 == src:
              print('::warning::版本号没变化（可能上游没升版）')
          open(path, 'w', encoding='utf-8').write(src2)

          # 给后续步骤用
          out = os.environ.get('GITHUB_OUTPUT', '/dev/null')
          with open(out, 'a') as f:
              f.write('version=%s\n' % new_ver)
              f.write('code=%s\n' % new_code)
              f.write('upstream_version=%s\n' % up_ver)
              f.write('upstream_code=%s\n' % up_code)
          PY

      # --------------------------------------------------------
      # 签名
      # --------------------------------------------------------
      - name: 还原 release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::没有配置 KEYSTORE_BASE64，只构建 debug 包"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: 生成 keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Java 的 Properties.load(InputStream) 按 ISO-8859-1 解码，
          # 直接把中文别名写进去会变成乱码（"浅末年代_" → "æµæ«å¹´ä»£_"），
          # 打包时报 No key with alias ... found in keystore。
          # 解决：别名里所有非 ASCII 字符都写成 \uXXXX 转义，Java 能正确还原。
          python3 - <<'PY'
          import os
          alias = os.environ['KEY_ALIAS']
          esc = ''.join(
              c if ord(c) < 128 else '\\u%04X' % ord(c)
              for c in alias
          )
          lines = [
              'storeFile=%s/release.keystore' % os.environ['GITHUB_WORKSPACE'],
              'storePassword=%s' % os.environ['KEYSTORE_PASSWORD'],
              'keyAlias=%s' % esc,
              'keyPassword=%s' % os.environ['KEY_PASSWORD'],
          ]
          open('keystore.properties', 'w', encoding='latin-1').write('\n'.join(lines) + '\n')
          print('keystore.properties 已生成')
          print('keyAlias=' + esc)
          PY

      - name: 验证签名配置可读
        if: env.HAS_KEYSTORE == 'true'
        run: |
          # 用 Java 自己的 Properties 读一遍，这才是 Gradle 真实行为。
          # 别用 shell 的 printf %b 去还原 \uXXXX —— 它不认，只认 \0NNN 八进制。
          cat > /tmp/CheckKs.java <<'JAVA'
          import java.util.Properties;
          import java.io.*;
          public class CheckKs {
            public static void main(String[] a) throws Exception {
              Properties p = new Properties();
              try (InputStream in = new FileInputStream("keystore.properties")) {
                p.load(in);   // ← 和 Gradle 读法完全一样（ISO-8859-1）
              }
              String alias = p.getProperty("keyAlias");
              String pass  = p.getProperty("storePassword");
              System.out.println("properties 里的 keyAlias = [" + alias + "]");

              ProcessBuilder pb = new ProcessBuilder(
                  "keytool", "-list", "-keystore", a[0], "-storepass", pass);
              pb.redirectErrorStream(true);
              Process proc = pb.start();
              String out = new String(proc.getInputStream().readAllBytes(), "UTF-8");
              proc.waitFor();

              // keytool -list 不带 -v 时条目行长这样：
              //   浅末年代_, Nov 25, 2026, PrivateKeyEntry,
              // 所以按「别名 + 逗号」匹配，别找 "Alias name:"（那是 -v 才有的）
              if (out.contains(alias + ",")) {
                System.out.println("OK 别名在 keystore 里找到: " + alias);
              } else {
                System.out.println("ERROR keystore 里找不到别名 [" + alias + "]");
                System.out.println(out);
                System.exit(1);
              }
            }
          }
          JAVA
          javac -d /tmp /tmp/CheckKs.java
          java -cp /tmp CheckKs "$GITHUB_WORKSPACE/release.keystore"

      # --------------------------------------------------------
      # 检查 + 测试
      # --------------------------------------------------------
      - name: 静态检查
        run: gradle :core:detekt --console=plain

      - name: 单元测试
        run: gradle :core:test --console=plain

      # --------------------------------------------------------
      # 打包
      # --------------------------------------------------------
      - name: 打包
        id: build
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            gradle :app:assembleRelease --console=plain
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            gradle :app:assembleDebug --console=plain
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: 重命名产物
        run: |
          EXT=$(basename "${{ steps.build.outputs.apk }}" | sed 's/.*\.//')
          NAME="ai-gateway-${{ steps.version.outputs.version }}-${{ steps.build.outputs.kind }}.$EXT"
          cp "${{ steps.build.outputs.apk }}" "$NAME"
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"
          echo "产物：$NAME"

      - name: 上传临时产物
        uses: actions/upload-artifact@v5
        with:
          name: apk-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: ${{ env.ARTIFACT }}
          retention-days: 14

      - name: 生成发版说明
        id: notes
        env:
          UPSTREAM_LOG: ${{ needs.sync.outputs.upstream_log }}
          UPSTREAM_REF: ${{ needs.sync.outputs.upstream_ref }}
          MY_VER: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "body<<NOTES_EOF"
            echo "## 更新内容（${UPSTREAM_REF:-上游} → v${MY_VER}）"
            echo ""
            if [ -n "$UPSTREAM_LOG" ]; then
              printf '%s\n' "$UPSTREAM_LOG"
            else
              echo "- 无应用相关变化"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 发 Release（仅 release 包）
        if: steps.build.outputs.kind == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ needs.sync.outputs.sha || github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ env.ARTIFACT }}

      - name: 构建结果汇总
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游版本 | \`${{ steps.version.outputs.upstream_version }}\` (${{ steps.version.outputs.upstream_code }}) |"
            echo "| 本版版本 | \`${{ steps.version.outputs.version }}\` (${{ steps.version.outputs.code }}) |"
            echo "| 类型 | \`${{ steps.build.outputs.kind }}\` |"
            echo "| 产物 | \`${{ env.ARTIFACT }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
