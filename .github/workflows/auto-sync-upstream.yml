name: Auto Sync Upstream & Build

# 自动跟上游：
#   1. 定时（每 6 小时）检查上游有没有新提交
#   2. 有就自动合并（工具链冲突保留本地版，其它冲突则放弃并通知）
#   3. 核对二改补丁没被上游悄悄覆盖
#   4. 推回 ide 分支
#   5. 合并成功就自动构建 APK 并发 Release
#
# 手动触发时可以选「只检查不合并」，方便先看看会发生什么。

on:
  schedule:
    # 每 6 小时一次（UTC）。GitHub 的 cron 在高峰期可能延迟几分钟到半小时。
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查不合并（不推送、不构建）'
        required: false
        default: false
        type: boolean
      force_build:
        description: '即使没同步也构建一次'
        required: false
        default: false
        type: boolean

# 两个工作流同时改 ide 分支会打架，串行执行
concurrency:
  group: auto-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  # ============================================================
  # 第一步：同步上游
  # ============================================================
  sync:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.sync.outputs.SYNC_RESULT }}
      sha: ${{ steps.sync.outputs.SYNC_SHA }}
      count: ${{ steps.sync.outputs.SYNC_COUNT }}
      conflicts: ${{ steps.sync.outputs.SYNC_CONFLICTS }}
      exit_code: ${{ steps.sync.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ide
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远端
        run: |
          git remote add upstream https://github.com/xibai6668/Android-AI-gateway.git 2>/dev/null \
            || git remote set-url upstream https://github.com/xibai6668/Android-AI-gateway.git
          git remote -v

      - name: 同步上游
        id: sync
        env:
          UPSTREAM_REMOTE: upstream
          UPSTREAM_BRANCH: main
        run: |
          chmod +x tools/ci-sync-upstream.sh
          set +e
          bash tools/ci-sync-upstream.sh
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # 0=最新 10=合并成功 78=冲突放弃 其它=错误
          case "$CODE" in
            0|10|78) exit 0 ;;
            *) echo "::error::同步脚本异常退出（$CODE）"; exit 1 ;;
          esac

      - name: 同步结果汇总
        if: always()
        run: |
          {
            echo "### 上游同步结果"
            echo ""
            echo "- 结果：\`${{ steps.sync.outputs.SYNC_RESULT }}\`"
            echo "- 退出码：\`${{ steps.sync.outputs.exit_code }}\`"
            echo "- 新提交：\`${{ steps.sync.outputs.SYNC_SHA }}\`"
            echo "- 合并数：${{ steps.sync.outputs.SYNC_COUNT }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 有冲突 → 建 Issue 提醒
        if: |
          steps.sync.outputs.SYNC_RESULT == 'conflict' ||
          steps.sync.outputs.SYNC_RESULT == 'guard-lost'
        uses: actions/github-script@v8
        env:
          SYNC_RESULT: ${{ steps.sync.outputs.SYNC_RESULT }}
          SYNC_FILES: ${{ steps.sync.outputs.SYNC_CONFLICTS }}
        with:
          script: |
            const r = process.env.SYNC_RESULT;
            const files = process.env.SYNC_FILES || '';
            const title = r === 'guard-lost'
              ? '⚠️ 上游同步被拦：二改补丁丢失'
              : '⚠️ 上游同步被拦：有冲突需要手工处理';
            const body = [
              '## 自动同步上游失败',
              '',
              `**结果**：\`${r}\``,
              '',
              r === 'guard-lost'
                ? '上游改动把二改的补丁覆盖掉了（**编译不会报错，但功能会静默消失**）。'
                : '以下文件有冲突，无法按预设规则自动解决：',
              '',
              files ? '```\n' + files + '\n```' : '_（无文件列表）_',
              '',
              '### 手工处理办法',
              '',
              '```bash',
              'git fetch upstream',
              'git checkout ide',
              'git merge upstream/main',
              '# 解决冲突后：',
              'git commit',
              'git push',
              '```',
              '',
              '或者本地跑 `bash sync-upstream.sh`（交互式，会逐步问你）。',
              '',
              `> 由自动同步工作流创建 · [查看本次运行](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync',
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-sync'],
              });
            }

      - name: 推送合并结果
        if: |
          steps.sync.outputs.SYNC_RESULT == 'merged' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git push origin HEAD:ide
          echo "已推送到 ide 分支" >> "$GITHUB_STEP_SUMMARY"

      - name: 同步成功 → 关闭之前的告警 Issue
        if: |
          steps.sync.outputs.SYNC_RESULT == 'merged' ||
          steps.sync.outputs.SYNC_RESULT == 'up-to-date'
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync',
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: '✅ 本次同步成功，自动关闭。',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }

  # ============================================================
  # 第二步：构建并发布（仅当同步产生了新提交）
  # ============================================================
  build:
    needs: sync
    if: |
      needs.sync.outputs.result == 'merged' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_build == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha || 'ide' }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # 注意：二改锁定 9.0.0，不要跟上游的 9.9.1
          gradle-version: '9.0.0'

      - name: 还原 release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::没有配置 KEYSTORE_BASE64，只构建 debug 包"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: 生成 keystore.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 静态检查
        run: gradle :core:detekt --console=plain

      - name: 单元测试
        run: gradle :core:test --console=plain

      - name: 打包
        id: build
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            gradle :app:assembleRelease --console=plain
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            gradle :app:assembleDebug --console=plain
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION ($CODE)"

      - name: 重命名产物
        run: |
          EXT=$(basename "${{ steps.build.outputs.apk }}" | sed 's/.*\.//')
          NAME="ai-gateway-${{ steps.version.outputs.version }}-${{ steps.build.outputs.kind }}.$EXT"
          cp "${{ steps.build.outputs.apk }}" "$NAME"
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"

      - name: 上传临时产物
        uses: actions/upload-artifact@v5
        with:
          name: apk-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: ${{ env.ARTIFACT }}
          retention-days: 14

      - name: 发 Release（仅 release 包）
        if: steps.build.outputs.kind == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}-auto
          target_commitish: ${{ needs.sync.outputs.sha || github.sha }}
          name: v${{ steps.version.outputs.version }}（自动同步）
          body: |
            ## 自动构建

            由上游同步工作流自动触发。

            - 上游：`xibai6668/Android-AI-gateway`
            - 同步提交：`${{ needs.sync.outputs.sha }}`
            - 合并提交数：${{ needs.sync.outputs.count }}

            > 本包来自 `ide` 分支（二改版），不是官方原版。
          files: ${{ env.ARTIFACT }}

      - name: 构建结果汇总
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo "- 版本：\`${{ steps.version.outputs.version }}\` (${{ steps.version.outputs.code }})"
            echo "- 类型：\`${{ steps.build.outputs.kind }}\`"
            echo "- 产物：\`${{ env.ARTIFACT }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
